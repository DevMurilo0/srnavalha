<!-- Sr. Navalha · Loader v2 adaptado do protótipo fornecido pelo proprietário. -->
<div id="sr-loader-stage" class="snv2-loader" role="group" aria-label="Abertura Sr. Navalha">
  <!-- The Perfect Cut: superfície contínua que será separada pela tesoura.
       As duas superfícies são criadas uma única vez, quando o corte começa. -->
  <div class="snv2-panels" id="snv2-panels" aria-hidden="true"></div>
  <span class="snv2-rail snv2-rail--left" aria-hidden="true"></span>
  <span class="snv2-rail snv2-rail--right" aria-hidden="true"></span>
  <div class="snv2-center" aria-hidden="true">
    <div class="snv2-badge">
      <svg class="snv2-ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="snv2-ring__ticks" cx="100" cy="100" r="86"></circle>
        <circle class="snv2-ring__draw" cx="100" cy="100" r="94"></circle>
      </svg>
      <div class="snv2-plate" id="sr-loader-plate">
        <svg class="snv2-fallback" viewBox="0 0 100 100" aria-hidden="true">
          <text x="50" y="52" text-anchor="middle" font-size="34" letter-spacing="3">SN</text>
          <path d="M24 66h52l-6 8H30z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"></path>
          <circle cx="62" cy="70" r="1.6"></circle>
        </svg>
        <!-- Logo oficial: o fundo escuro da WebP vira alfa zero via filtro.
             A tinta resultante permanece sobre qualquer cor sem formar placa. -->
        <svg class="snv2-cutout-logo" viewBox="0 0 640 412" aria-hidden="true" focusable="false">
          <defs>
            <filter id="snv2-logo-matte" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
              <feColorMatrix type="matrix" values="0 0 0 0 .14  0 0 0 0 .115  0 0 0 0 .098  .466 .466 .466 0 -.34"></feColorMatrix>
            </filter>
          </defs>
          <image href="assets/images/v8/logo-640.webp" width="640" height="412" filter="url(#snv2-logo-matte)"></image>
        </svg>
        <img class="snv2-logo-probe" src="assets/images/v8/logo-640.webp" width="640" height="412" alt="" decoding="async" fetchpriority="high">
        <span class="snv2-shine"></span>
      </div>
    </div>
    <div class="snv2-name" aria-hidden="true"><span style="--snv-i:0">S</span><span style="--snv-i:1">R</span><span style="--snv-i:2">.</span><span class="snv2-space" style="--snv-i:3">&nbsp;</span><span style="--snv-i:4">N</span><span style="--snv-i:5">A</span><span style="--snv-i:6">V</span><span style="--snv-i:7">A</span><span style="--snv-i:8">L</span><span style="--snv-i:9">H</span><span style="--snv-i:10">A</span></div>
    <div class="snv2-tag"><span>Seu estilo, nossa assinatura</span></div>
  </div>
  <div class="snv2-track" aria-hidden="true">
    <div class="snv2-rule">
      <div class="snv2-fill"></div>
      <svg class="snv2-scissors" viewBox="0 0 34 28">
        <g class="snv2-blade-a"><path d="M12 14L33 14M12 14L6 9"></path><circle cx="4" cy="7.5" r="3"></circle></g>
        <g class="snv2-blade-b"><path d="M12 14L33 14M12 14L6 19"></path><circle cx="4" cy="20.5" r="3"></circle></g>
      </svg>
    </div>
    <div class="snv2-count"><span>Preparando</span><b id="sr-loader-percent">0%</b></div>
  </div>
  <div class="snv2-cut-flight" aria-hidden="true">
    <svg class="snv2-scissors" viewBox="0 0 34 28">
      <g class="snv2-blade-a"><path d="M12 14L33 14M12 14L6 9"></path><circle cx="4" cy="7.5" r="3"></circle></g>
      <g class="snv2-blade-b"><path d="M12 14L33 14M12 14L6 19"></path><circle cx="4" cy="20.5" r="3"></circle></g>
    </svg>
  </div>
  <div class="snv2-seam" aria-hidden="true"></div>
</div>
