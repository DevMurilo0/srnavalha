name: Sr. Navalha — The Cut editorial QA
on:
  push:
    branches:
      - reconstruction/arte-do-ritual
      - main
    paths:
      - 'js/**'
      - 'css/**'
      - 'templates/**'
      - 'assets/images/the-cut/**'
      - 'scripts/**'
      - 'index.html'
      - 'agendar.html'
      - 'admin.html'
      - 'confirmar.html'
      - '.github/workflows/v6-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated HTML and JavaScript
        run: |
          node --check js/the-cut/app.js
          node --check js/agendar.js
          node --check js/admin.js
          node --check lib/booking-server.js
          node --check api/health.js
          node --check api/bookings.js
          node --check api/confirm.js
          node --check api/session.js
          node --check api/blocked.js
          node --check js/confirmar.js
          node --check js/booking-local.js
          node --check scripts/test-admin.mjs
          node --check js/the-cut/motion.js
          node --check scripts/test-the-cut-motion.mjs
          node --check scripts/render-site.mjs
          node --check scripts/test-motion-states.mjs
          node --check scripts/capture-motion-frames.mjs
          node scripts/render-site.mjs
          git diff --exit-code -- index.html
          node --experimental-default-type=module scripts/test-booking-local.mjs
          node scripts/test-api-contract.mjs
      - name: Install browser and accessibility dependencies
        run: |
          mkdir -p /tmp/srnavalha-validation
          cd /tmp/srnavalha-validation
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright playwright-core @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          python3 -m http.server 8047 --bind 127.0.0.1 > /tmp/srnavalha-server.log 2>&1 &
          for n in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8047/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/srnavalha-server.log
          exit 1
      - name: Chromium — visual, functional and accessibility regression
        env:
          PLAYWRIGHT_PACKAGE: /tmp/srnavalha-validation/package.json
          SITE_URL: http://127.0.0.1:8047
        run: |
          set -euo pipefail
          export CHROME_PATH="$(cd /tmp/srnavalha-validation && node -p "require('playwright-core').chromium.executablePath()")"
          node scripts/test-the-cut.mjs
          node scripts/test-the-cut-motion.mjs
          node scripts/test-motion-states.mjs
          node scripts/test-booking-wizard.mjs
          node scripts/test-booking-wizard-state.mjs
          node scripts/test-admin.mjs
      - name: Package working source for download
        if: always()
        run: |
          mkdir -p dist
          zip -qr dist/srnavalha-the-cut-source.zip index.html agendar.html admin.html confirmar.html api lib package.json assets css js templates scripts print README.md DESIGN.md PRODUCT.md
      - name: Upload source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srnavalha-the-cut-source
          retention-days: 14
          path: dist/srnavalha-the-cut-source.zip
      - name: Upload visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srnavalha-the-cut-visual-qa
          if-no-files-found: ignore
          retention-days: 14
          path: |
            docs/the-cut/qa/**
            docs/motion-states/**
